<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Klaviyo Copilot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --accent: #6c5ce7;
    --bg: #0f0f14;
    --card: #17171f;
    --text: #e8e8ef;
    --muted: #9a9aa8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 40px 20px;
  }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 28px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    border: 1px solid #24242e;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    background: #0f0f14;
    border: 1px solid #2c2c38;
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.95rem;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: #2c2c38; }
  .email-block {
    border-left: 3px solid var(--accent);
    padding-left: 16px;
    margin-bottom: 24px;
  }
  .email-block h3 { margin-bottom: 4px; }
  .timing { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .subject-variant {
    background: #0f0f14;
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .body-copy { white-space: pre-wrap; margin-top: 12px; font-size: 0.9rem; line-height: 1.5; }
  #results { display: none; }
  #error { color: #ff6b6b; margin-top: 12px; display: none; }
  .loading { color: var(--muted); margin-top: 12px; display: none; }
  .site-footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #24242e;
  text-align: center;
}
.site-footer a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.85rem;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid #2c2c38;
  transition: color 0.15s, border-color 0.15s;
}
.site-footer a:hover {
  color: var(--text);
  border-color: var(--accent);
}
.site-footer svg { width: 16px; height: 16px; flex-shrink: 0; }
.email-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.copy-btn {
  background: transparent;
  border: 1px solid #2c2c38;
  border-radius: 6px;
  padding: 6px 10px;
  margin: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  color: var(--muted);
}
.copy-btn:hover { color: var(--text); border-color: var(--accent); }
.copy-btn svg { width: 14px; height: 14px; }

.coming-soon-btn {
  background: transparent;
  border: 1px dashed #6c5ce7;
  color: #a78bfa;
  cursor: default;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
}
.coming-soon-btn:hover { background: transparent; }
.coming-soon-btn .badge {
  background: #6c5ce7;
  color: white;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 2px 7px;
  border-radius: 10px;
  text-transform: uppercase;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--card);
  border: 1px solid #2c2c38;
  border-radius: 12px;
  padding: 24px;
  width: 90%;
  max-width: 400px;
}
.modal-box h3 { margin-top: 0; }
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.modal-actions button { margin-top: 0; flex: 1; }
.modal-success svg { width: 40px; height: 40px; color: #4ade80; display: block; margin: 0 auto 12px; }
.modal-success a {
  display: inline-block;
  margin-top: 16px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.modal-success a:hover { text-decoration: underline; }
.modal-error { color: #ff6b6b; font-size: 0.9rem; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Klaviyo Copilot</h1>
  <p class="subtitle">Generate on-brand copy and push it live to Klaviyo, built on real lifecycle strategy.</p>

  <div class="card">
    <label>Brand Name</label>
    <input id="brandName" placeholder="e.g. Birdie Fortescue" />

    <label>Product / Offer Description</label>
    <textarea id="productDescription" placeholder="e.g. Handmade ceramic homeware, mid-range price point, targets design-conscious 30-45 year olds"></textarea>

    <label>Tone / Voice Notes</label>
    <input id="toneNotes" placeholder="e.g. Warm, a little witty, never salesy" />

    <label>Flow Type</label>
    <select id="flowType" onchange="toggleCampaignFields()">
      <option value="welcome">Welcome Series</option>
      <option value="abandoned_cart">Abandoned Cart</option>
      <option value="win_back">Win-Back</option>
      <option value="post_purchase">Post-Purchase</option>
      <option value="campaign">Campaign (single send)</option>
    </select>

    <div id="campaignFields" style="display:none;">
      <label>Campaign Objective</label>
      <input id="campaignObjective" placeholder="e.g. Drive sales for a 20%-off Labor Day sale" />

      <label>Target Audience</label>
      <textarea id="targetAudience" placeholder="e.g. Past purchasers who haven't bought in 60+ days"></textarea>
    </div>

    <button id="generateBtn" onclick="generateFlow()">Generate Copy</button>
    <div class="loading" id="loading">Generating... this usually takes 10-20 seconds.</div>
    <div id="error"></div>
  </div>

  <div id="results"></div>
  <div class="site-footer">
  <a href="https://www.linkedin.com/in/uche-emeka-travys/" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.26 2.37 4.26 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
    Built by Travis - connect on LinkedIn
  </a>
</div>
</div>

<script>
const API_BASE = ""; // same origin — Express serves this file and the API

function toggleCampaignFields() {
  const isCampaign = document.getElementById("flowType").value === "campaign";
  document.getElementById("campaignFields").style.display = isCampaign ? "block" : "none";
}

async function generateFlow() {
  const btn = document.getElementById("generateBtn");
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const results = document.getElementById("results");

  const payload = {
    brandName: document.getElementById("brandName").value.trim(),
    productDescription: document.getElementById("productDescription").value.trim(),
    toneNotes: document.getElementById("toneNotes").value.trim(),
    flowType: document.getElementById("flowType").value,
    campaignObjective: document.getElementById("campaignObjective").value.trim(),
    targetAudience: document.getElementById("targetAudience").value.trim(),
  };

  if (!payload.brandName || !payload.productDescription || !payload.toneNotes) {
    error.textContent = "Please fill in brand name, product description and the brand tone/voice.";
    error.style.display = "block";
    return;
  }

  error.style.display = "none";
  results.style.display = "none";
  results.innerHTML = "";
  loading.style.display = "block";
  btn.disabled = true;

  try {
    const res = await fetch(`${API_BASE}/api/generate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 503) {
        throw new Error("Please try again later — the model is experiencing high demand.");
      }
      throw new Error(data.error || "Something went wrong.");
    }

    renderResults(data);
  } catch (err) {
    error.textContent = err.message;
    error.style.display = "block";
  } finally {
    loading.style.display = "none";
    btn.disabled = false;
  }
}

function renderResults(data) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  data.emails.forEach((email, i) => {
    const block = document.createElement("div");
    block.className = "card email-block";
    const isCampaign = data.flowType === "campaign";
    const actionHtml = isCampaign
    ? `<button class="secondary push-btn">Push to Klaviyo (draft)</button>`
    : `<button class="coming-soon-btn" disabled><span class="badge">Coming Soon</span> Direct Klaviyo Flow Integration</button>`;

    block.innerHTML = `
      <div class="email-header">
        <h3>Email ${i + 1}</h3>
        <button class="copy-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Copy</span>
        </button>
      </div>
      <div class="timing">${email.sendTiming}</div>
      <label>Subject Line Variants</label>
      ${email.subjectLines.map(s => `<div class="subject-variant">${escapeHtml(s)}</div>`).join("")}
      <label>Preview Text</label>
      <div class="subject-variant">${escapeHtml(email.previewText)}</div>
      <label>Body Copy</label>
      <div class="body-copy">${escapeHtml(email.body)}</div>
      ${actionHtml}
    `;

    block.querySelector(".copy-btn").addEventListener("click", (e) => {
      copyEmail(e.currentTarget, email.subjectLines[0], email.previewText, email.body);
    });
    if (isCampaign) {
      block.querySelector(".push-btn").addEventListener("click", () => {
        pushToKlaviyo(email.subjectLines[0], email.previewText, email.body);
      });
    }

    results.appendChild(block);
  });

  results.style.display = "block";
}

async function copyEmail(btn, subjectLine, previewText, body) {
  const text = `Subject: ${subjectLine}\nPreview: ${previewText}\n\n${body}`;
  try {
    await navigator.clipboard.writeText(text);
    const label = btn.querySelector("span");
    const original = label.textContent;
    label.textContent = "Copied!";
    btn.disabled = true;
    setTimeout(() => {
      label.textContent = original;
      btn.disabled = false;
    }, 1500);
  } catch (err) {
    alert("Couldn't copy — your browser may be blocking clipboard access.");
  }
}

let pendingEmailData = null;
let klaviyoConfig = { requireApiKey: false };

async function pushToKlaviyo(subjectLine, previewText, body) {
  pendingEmailData = { subjectLine, previewText, body };

  const configRes = await fetch(`${API_BASE}/api/config`);
  klaviyoConfig = await configRes.json();

  const modal = document.getElementById("klaviyoModal");
  const content = document.getElementById("klaviyoModalContent");

  const apiKeyFieldHtml = klaviyoConfig.requireApiKey
    ? `<label>Your Klaviyo Private API Key</label>
       <input id="modalApiKey" type="password" placeholder="pk_xxxxxxxx" />
       <p style="font-size: 0.75rem; color: var(--muted); margin-top: 4px;">
         Never stored — used only for this request. Get yours in Klaviyo under Settings → API Keys.
       </p>`
    : "";


  content.innerHTML = `
    <h3>Push to Klaviyo</h3>
    ${apiKeyFieldHtml}
    <label>Klaviyo List/Segment ID</label>
    <input id="modalListId" placeholder="e.g. Uz89UT" />
    <label>Verified Sender Email</label>
    <input id="modalFromEmail" placeholder="you@yourdomain.com" />
    <label>Email Template Type</label>
    <select id="modalTemplateType">
      <option value="CODE">Plain HTML (code editor)</option>
      <option value="HYBRID">Drag-and-drop editable</option>
    </select>
    <div class="modal-error" id="modalError"></div>
    <div class="modal-actions">
      <button class="secondary" id="modalCancel">Cancel</button>
      <button id="modalSubmit">Create Draft Campaign</button>
    </div>
  `;

  modal.classList.add("open");
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("modalSubmit").addEventListener("click", submitToKlaviyo);
}

function closeModal() {
  document.getElementById("klaviyoModal").classList.remove("open");
  pendingEmailData = null;
}

async function submitToKlaviyo() {
  const listId = document.getElementById("modalListId").value.trim();
  const fromEmail = document.getElementById("modalFromEmail").value.trim();
  const errorEl = document.getElementById("modalError");
  const submitBtn = document.getElementById("modalSubmit");
  const templateType = document.getElementById("modalTemplateType").value;
  const apiKeyField = document.getElementById("modalApiKey");
  const apiKey = apiKeyField ? apiKeyField.value.trim() : "";

  if (!listId || !fromEmail || (klaviyoConfig.requireApiKey && !apiKey)) {
  errorEl.textContent = klaviyoConfig.requireApiKey
    ? "List ID, sender email, and API key are all required."
    : "List ID and sender email are required.";
  errorEl.style.display = "block";
  return;
}

  errorEl.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.textContent = "Creating...";

  try {
    const res = await fetch(`${API_BASE}/api/push-to-klaviyo`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...pendingEmailData, listId, fromEmail, templateType, apiKey }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to push to Klaviyo.");

    showSuccessModal(data.campaignId);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Create Draft Campaign";
  }
}

function showSuccessModal(campaignId) {
  const content = document.getElementById("klaviyoModalContent");
  const campaignUrl = `https://www.klaviyo.com/campaign/${campaignId}/wizard`;

  content.innerHTML = `
    <div class="modal-success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      <h3 style="text-align:center;">Draft campaign created!</h3>
      <p style="text-align:center; color: var(--muted); font-size: 0.9rem;">Your content has been attached and it's ready to review in Klaviyo.</p>
      <div style="text-align:center;">
        <a href="${campaignUrl}" target="_blank" rel="noopener noreferrer">Open campaign in Klaviyo →</a>
      </div>
    </div>
    <div class="modal-actions">
      <button id="modalClose">Done</button>
    </div>
  `;
  document.getElementById("modalClose").addEventListener("click", closeModal);
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

<div class="modal-overlay" id="klaviyoModal">
  <div class="modal-box" id="klaviyoModalContent"></div>
</div>
</body>
</html>
